# GoReleaser configuration — https://goreleaser.com
# Cross-compiles the quantscan CLI, injects the version, and publishes a GitHub
# Release with archives and checksums on every pushed v* tag.
version: 2

project_name: quantscan

before:
  hooks:
    - go mod tidy

builds:
  - id: quantscan
    main: ./cmd/quantscan
    binary: quantscan
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: quantscan
    ids:
      - quantscan
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats:
      - tar.gz
    files:
      - LICENSE
      - THIRD_PARTY_NOTICES.txt
      - README.md
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
